<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX MiniApp Launcher</title>

    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">

    <!-- Библиотека MAX будет использоваться в следующем коммите -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>MAX MiniApp Launcher</h1>

        <div id="status" class="status">
            Инициализация...
        </div>

        <div id="userCard" class="user-card hidden">

            <div class="avatar">
                👤
            </div>

            <div class="name" id="userName">
                —
            </div>

            <div class="userid" id="userId">
                —
            </div>

        </div>

        <button id="openButton">
            Открыть приложение
        </button>

        <div class="version" id="version"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/max-api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
